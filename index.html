<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="description" content="Kuala Lumpur After Dark is an editorial-first nightlife discovery platform for finding underground techno basements, hidden speakeasies, rooftop lounges, and late-night food in KL." />

  <!-- Modular CSS Architecture -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/responsive.css" />
